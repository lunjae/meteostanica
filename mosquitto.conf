# Mosquitto konfiguracija za Windows
# Kopiraj preko fajla  C:\Program Files\mosquitto\mosquitto.conf  (sacuvaj staru kopiju)

listener 1883
persistence true

# --- Varijanta A: bez lozinke (dovoljno za kucnu mrezu) ---
allow_anonymous true

# --- Varijanta B: sa lozinkom (zakomentarisi gornju liniju, otkomentarisi donje) ---
# allow_anonymous false
# password_file C:\Program Files\mosquitto\passwd
# Pravljenje korisnika (cmd kao Administrator):
#   cd "C:\Program Files\mosquitto"
#   mosquitto_passwd -c passwd esp32
